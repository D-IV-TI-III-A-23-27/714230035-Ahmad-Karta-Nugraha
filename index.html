<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Architecture: PCA Visualizer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --accent-color: #38bdf8; /* Blue for PC1 */
            --point-color: #fbbf24;  /* Amber for Data */
            --text-color: #f1f5f9;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .controls {
            background: var(--panel-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        canvas {
            background: #000;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
        }

        .stats {
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        input[type=range] {
            cursor: pointer;
        }

        h1 { margin-bottom: 10px; font-weight: 300; }
        p { color: #94a3b8; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Visualisasi Alur PCA</h1>
    <p>Garis biru menunjukkan arah varians maksimum (Eigenvector Utama).</p>

    <div class="controls">
        <div class="control-group">
            <label>Penyebaran Data (Variance)</label>
            <input type="range" id="spreadSlider" min="20" max="180" value="100">
        </div>
        <div class="control-group">
            <label>Rotasi Data</label>
            <input type="range" id="rotationSlider" min="0" max="360" value="45">
        </div>
        <div class="control-group">
            <label>Proyeksi Titik</label>
            <input type="range" id="projectionSlider" min="0" max="1" step="0.01" value="0">
        </div>
    </div>

    <canvas id="pcaCanvas" width="600" height="600"></canvas>
    
    <div class="stats" id="pcStats">
        PC1 Angle: 0° | Variance Explained: High
    </div>
</div>

<script>
    const canvas = document.getElementById('pcaCanvas');
    const ctx = canvas.getContext('2d');
    const spreadSlider = document.getElementById('spreadSlider');
    const rotationSlider = document.getElementById('rotationSlider');
    const projectionSlider = document.getElementById('projectionSlider');
    const statsEl = document.getElementById('pcStats');

    let points = [];
    const numPoints = 150;

    // 1. Fungsi menghasilkan data sintetis
    function generatePoints() {
        const spread = parseInt(spreadSlider.value);
        const rotation = parseInt(rotationSlider.value) * (Math.PI / 180);
        points = [];

        for (let i = 0; i < numPoints; i++) {
            // Membuat distribusi elips (High variance di X, low di Y)
            let x = (Math.random() - 0.5) * 400;
            let y = (Math.random() - 0.5) * spread;

            // Rotasi titik
            let rx = x * Math.cos(rotation) - y * Math.sin(rotation);
            let ry = x * Math.sin(rotation) + y * Math.cos(rotation);

            points.push({ x: rx, y: ry });
        }
    }

    // 2. Fungsi Inti PCA (Eigen-decomposition sederhana 2D)
    function calculatePCA() {
        let n = points.length;
        
        // Mean centering (Opsional karena data sintetis kita sudah di 0,0)
        let meanX = points.reduce((a, b) => a + b.x, 0) / n;
        let meanY = points.reduce((a, b) => a + b.y, 0) / n;

        // Hitung Matriks Kovarians
        let covXX = 0, covXY = 0, covYY = 0;
        points.forEach(p => {
            let dx = p.x - meanX;
            let dy = p.y - meanY;
            covXX += dx * dx;
            covXY += dx * dy;
            covYY += dy * dy;
        });

        // Hitung sudut Eigenvector Utama menggunakan Atan2
        // Rumus: theta = 0.5 * atan2(2 * covXY, covXX - covYY)
        let theta = 0.5 * Math.atan2(2 * covXY, covXX - covYY);
        
        return { theta, meanX, meanY };
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2); // Center of canvas

        const pca = calculatePCA();
        const projVal = parseFloat(projectionSlider.value);

        // Draw Axis
        ctx.strokeStyle = '#334155';
        ctx.beginPath();
        ctx.moveTo(-300, 0); ctx.lineTo(300, 0);
        ctx.moveTo(0, -300); ctx.lineTo(0, 300);
        ctx.stroke();

        // Draw Points
        points.forEach(p => {
            // Hitung posisi proyeksi ke PC1
            // Dot product projection: proj = (p . v) * v
            let vX = Math.cos(pca.theta);
            let vY = Math.sin(pca.theta);
            let dot = p.x * vX + p.y * vY;
            
            let projX = dot * vX;
            let projY = dot * vY;

            // Interpolasi antara titik asli dan proyeksi (untuk animasi)
            let curX = p.x + (projX - p.x) * projVal;
            let curY = p.y + (projY - p.y) * projVal;

            ctx.fillStyle = projVal > 0.8 ? '#38bdf8' : '#fbbf24';
            ctx.beginPath();
            ctx.arc(curX, curY, 3, 0, Math.PI * 2);
            ctx.fill();

            // Draw line to projection if slider is active
            if (projVal > 0.1 && projVal < 0.9) {
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(projX, projY);
                ctx.stroke();
            }
        });

        // Draw Principal Component Line (PC1)
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        let len = 280;
        ctx.moveTo(-Math.cos(pca.theta) * len, -Math.sin(pca.theta) * len);
        ctx.lineTo(Math.cos(pca.theta) * len, Math.sin(pca.theta) * len);
        ctx.stroke();

        ctx.restore();

        // Update Stats
        statsEl.innerText = `PC1 Angle: ${(pca.theta * 180 / Math.PI).toFixed(1)}° | Data terpusat di (0,0)`;

        requestAnimationFrame(draw);
    }

    // Event Listeners
    [spreadSlider, rotationSlider].forEach(el => {
        el.addEventListener('input', generatePoints);
    });

    // Start
    generatePoints();
    draw();
</script>

</body>
</html>
